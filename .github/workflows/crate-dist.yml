
name: Create crate dist
on:
  push:
    tags:
      - '**'

jobs:
  crate-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create crate dist
        uses: projg2/crate-dist-action@v1
        with:
          directories: crates/cli lib
          dist-filename: tree-sitter-generate_perf_3_final-crates.tar.xz
          run-cargo-update: false

